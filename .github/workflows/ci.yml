name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "1.23"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go-version-file reads the toolchain version from go.mod so it is
      # declared once, not duplicated between go.mod and this matrix.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        # v7, not v6: v6 only knows how to install golangci-lint v1.x
        # binaries, but .golangci.yml uses the v2 config schema
        # (`version: "2"`) — v6 + this config resolves a v1.64.x binary
        # that then rejects the file's v2-only keys ("formatters",
        # top-level "version") as unknown. v7 is the first action version
        # with v2 support.
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # Scoped to "./ ./internal/..." rather than "./..." — examples/ has
      # no test files (they're runnable demo programs, go doc ./... and
      # `go build ./...` still cover compiling them) and would otherwise
      # show up in coverage.out at 0% coverage, dragging the merged
      # threshold-total below 80% for reasons unrelated to actual test
      # quality. This also sidesteps needing shell-specific package-list
      # filtering (grep/findstr) across the ubuntu/macos/windows matrix.
      #
      # -race is appended only on the ubuntu leg — it is slow on macOS and
      # Windows runners and this SDK's concurrency surface (HeartbeatScheduler,
      # ProcessHeartbeatScheduler) is adequately covered by the ubuntu leg alone.
      - name: Test (with race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./ ./internal/... -race -coverprofile=coverage.out -covermode=atomic

      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test ./ ./internal/... -coverprofile=coverage.out -covermode=atomic

      - name: Test (macOS, external linkmode)
        # Plain `go test` on macos-latest fails at runtime with
        # "dyld: missing LC_UUID load command" — Go's internal linker
        # doesn't emit an LC_UUID load command, which newer macOS
        # versions require (golang/go#68678, backported to the 1.22/1.23
        # line this matrix targets but not released as a default fix yet).
        # -linkmode=external routes linking through the system linker,
        # which does emit it.
        if: matrix.os == 'macos-latest'
        run: go test ./ ./internal/... -ldflags="-linkmode=external" -coverprofile=coverage.out -covermode=atomic

      - name: Build everything, including examples
        run: go build ./...

      - name: Enforce coverage floor
        # vladopajic/go-test-coverage is a Docker container action — GitHub
        # Actions only supports those on Linux runners, so this step must
        # not run on the macos-latest/windows-latest matrix legs (it fails
        # immediately with "Container action is only supported on Linux").
        # Coverage itself is still measured identically on every OS via the
        # `go test -coverprofile` step above; only the enforcement gate is
        # Linux-only.
        if: matrix.os == 'ubuntu-latest'
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          local-prefix: github.com/tamga-sh/tamga-go
          threshold-total: 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
