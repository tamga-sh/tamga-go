name: Release

# release-please opens/updates a "release PR" on every push to main that
# contains unreleased Conventional Commits, then — once that PR is merged —
# creates the GitHub release and the matching git tag on this same push
# trigger. For a Go module, tag creation *is* the entire release: there is
# no `go publish` step, unlike npm/PyPI/crates.io/NuGet SDKs in this org.
# pkg.go.dev and the Go module proxy discover new versions by resolving the
# git tag directly from GitHub — see the post-release step below for why
# that discovery still needs a manual nudge.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release PR must be authored by a GitHub App, not by the default
      # GITHUB_TOKEN. GitHub deliberately refuses to trigger workflows from
      # events attributed to GITHUB_TOKEN (recursion prevention), so a release
      # PR opened with it never fires the CI workflow — the required status
      # checks on main then never report, and the PR stays permanently
      # blocked pending an admin override. A PR opened by an App installation
      # token is treated as a normal actor's event and does trigger CI.
      #
      # This token is scoped to the release-please step alone (via its `token`
      # input, not an env var) so nothing else in the pipeline can pick it up.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  notify-proxy:
    name: Force pkg.go.dev indexing
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # The Go module proxy indexes a new version on-demand, the first time
      # something asks it for that version — which normally means the very
      # first `go get` from a real consumer after the tag exists. Left
      # alone, that leaves a freshly tagged release invisible on
      # pkg.go.dev for an indeterminate period. Fetching the version's
      # .info endpoint ourselves right after tagging forces that indexing
      # immediately instead of waiting on someone else to trigger it.
      #
      # tag_name comes from release-please's own output (the tag it just
      # created) — never reconstruct vX.Y.Z independently here. Go module
      # tags require the "v" prefix, and release-please's "go" release-type
      # already produces tags in that form.
      - name: Request version from proxy.golang.org
        run: |
          curl -fsSL "https://proxy.golang.org/github.com/tamga-sh/tamga-go/@v/${{ needs.release-please.outputs.tag_name }}.info"
