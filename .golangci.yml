# golangci-lint v2 config (migrated from the v1-schema scaffold via
# `golangci-lint migrate` — the locally installed and CI-pinned
# golangci-lint-action@v6 both resolve to a v2.x binary, which refuses to
# load a v1-schema file with no top-level `version` key at all). See
# docs/plans/tamga-go.plan.md Section A's original scaffold intent: govet,
# staticcheck, errcheck, ineffassign, unused, gosec, revive. `gosimple` from
# the original v1 list is intentionally absent here, not a regression — as
# of golangci-lint v1.55+/v2, `staticcheck` subsumes gosimple's checks
# (the S-prefixed rules), so enabling both is redundant.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: true
    revive:
      rules:
        - name: exported
          severity: warning
    gosec:
      excludes:
        # G115 (int conversion overflow) is noisy on JSON:API numeric
        # attributes coming from documented-range server fields (cores,
        # memory, disk, max_uses); revisit narrowly if real findings show
        # up once implementation lands, rather than disabling class-wide
        # here without evidence.
        - G115
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    # Crypto and checkout code (checkout_license.go, checkout_machine.go,
    # proof.go, internal/crypto/**) is explicitly in scope for gosec, not
    # excluded — see docs/plans/tamga-go.plan.md §4's mandatory
    # security-reviewer gate for those sections.
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
